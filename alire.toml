name = "sml"
description = "Declarative, low-overhead state machines (Boost.SML-inspired)"
version = "0.1.0"

authors = ["Lenny Maiorani"]
maintainers = ["Lenny Maiorani <639247+ldm5180@users.noreply.github.com>"]
maintainers-logins = ["ldm5180"]
licenses = "MIT"
website = "https://github.com/ldm5180/sml-ada"
tags = ["state-machine", "fsm", "spark"]

project-files = ["sml.gpr"]

[[depends-on]]
aunit = "^26.0.0"

[build-switches]
"*".ada_version = "Ada2022"

#  `alr test` runs actions with an empty GPR_PROJECT_PATH, so each wraps its
#  command in `alr exec --` to pick up the toolchain and AUnit.  Argv-only
#  actions (no `sh -c`, no `&&`) so this runs on Windows too; the runner exits
#  non-zero on any failing assertion, so a failure fails the job.  The suite is
#  built and run in both optimization modes (debug -O0, release -O3) so the
#  engine is exercised at each -O level.
[[actions]]
type = "test"
command = ["alr", "exec", "--", "gprbuild", "-p", "-XMODE=debug", "-P", "tests/test_sml.gpr"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/debug/test_runner"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "gprbuild", "-p", "-XMODE=release", "-P", "tests/test_sml.gpr"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/release/test_runner"]
